openapi: 3.0.3
info:
  title: CAB - User/Auth Service
  description: >
    Quản lý tài khoản, xác thực, hồ sơ Customer & Driver.
  version: "1.0.0"

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Auth
  - name: Customer
  - name: Driver

security:
  - bearerAuth: []

paths:
  /auth/register/customer:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản khách hàng
      operationId: registerCustomer
      x-fr: [FR01]
      x-ac: [AC01, AC02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ho_ten, sdt, mat_khau]
              properties:
                ho_ten: { type: string }
                sdt: { type: string }
                email: { type: string, format: email }
                mat_khau: { type: string, format: password }
      responses:
        "201":
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409":
          description: Định danh (SĐT/email) đã tồn tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register/driver:
    post:
      tags: [Auth]
      summary: Tạo tài khoản tài xế (tự đăng ký hoặc do NV vận hành tạo)
      operationId: registerDriver
      x-fr: [FR05]
      x-ac: [AC14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ho_ten, sdt, mat_khau]
              properties:
                ho_ten: { type: string }
                sdt: { type: string }
                mat_khau: { type: string, format: password }
                tao_boi: { type: string, enum: [self, operations_staff], default: self }
      responses:
        "201":
          description: Tạo tài khoản tài xế thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "409":
          description: Định danh đã tồn tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, cấp phiên (dùng chung Customer & Driver)
      operationId: login
      x-fr: [FR02]
      x-ac: [AC01, AC03, AC14]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dinh_danh, mat_khau]
              properties:
                dinh_danh: { type: string, description: "SĐT hoặc email" }
                mat_khau: { type: string, format: password }
      responses:
        "200":
          description: Đăng nhập thành công, trả về token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  role: { type: string, enum: [customer, driver] }
        "401":
          description: Sai mật khẩu — tăng bộ đếm đăng nhập sai của tài khoản.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: >
            Tài khoản đang bị khoá tạm thời do đã sai mật khẩu 5 lần liên
            tiếp (default) — thử lại sau 15 phút (default), cấu hình được.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers/me:
    get:
      tags: [Customer]
      summary: Xem hồ sơ cá nhân
      operationId: getMyCustomerProfile
      x-fr: [FR03]
      x-ac: [AC42]
      responses:
        "200":
          description: Thông tin hồ sơ khách hàng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    put:
      tags: [Customer]
      summary: Cập nhật hồ sơ cá nhân (họ tên, SĐT, email)
      operationId: updateMyCustomerProfile
      x-fr: [FR03]
      x-ac: [AC42, AC43, AC44, AC45]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ho_ten: { type: string }
                sdt: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400":
          description: Trường bắt buộc thiếu hoặc không hợp lệ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers/me/trips:
    get:
      tags: [Customer]
      summary: Xem lịch sử chuyến đi + số tiền
      operationId: getMyTripHistory
      x-fr: [FR04]
      x-ac: [AC13]
      responses:
        "200":
          description: Danh sách chuyến của chính khách hàng
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TripSummary" }

  /drivers/me:
    get:
      tags: [Driver]
      summary: Xem hồ sơ & phương tiện tài xế
      operationId: getMyDriverProfile
      x-fr: []
      x-ac: [AC15]
      responses:
        "200":
          description: Thông tin hồ sơ + phương tiện
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
    put:
      tags: [Driver]
      summary: Cập nhật hồ sơ tài xế
      operationId: updateMyDriverProfile
      x-fr: [FR06]
      x-ac: [AC15, AC46]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ho_ten: { type: string }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }

  /drivers/me/vehicle:
    put:
      tags: [Driver]
      summary: Cập nhật thông tin phương tiện
      operationId: updateMyVehicle
      x-fr: [FR07]
      x-ac: [AC15, AC46]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vehicle" }
      responses:
        "200":
          description: Lưu & dùng cho lọc ở Matching Service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "400":
          description: Thông tin phương tiện không hợp lệ (loại xe, biển số)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /drivers/me/status:
    patch:
      tags: [Driver]
      summary: Đổi trạng thái sẵn sàng / không sẵn sàng
      operationId: updateMyDriverStatus
      x-fr: [FR08]
      x-ac: [AC16, AC17]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trang_thai]
              properties:
                trang_thai: { type: string, enum: [available, unavailable] }
      responses:
        "200":
          description: Cập nhật & đủ điều kiện được ghép
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "409":
          description: Ngoài ca làm việc hoặc đang có chuyến — từ chối
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /drivers/me/location:
    patch:
      tags: [Driver]
      summary: Ghi nhận & cập nhật vị trí tài xế (nạp dữ liệu cho Matching Service)
      operationId: updateMyDriverLocation
      x-fr: [FR30]
      x-ac: [AC35]
      description: Text tự do — server quy đổi qua Distance Provider trước khi lưu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vi_tri_text]
              properties:
                vi_tri_text:
                  type: string
                  description: Text tự do, VD "Sân bay Tân Sơn Nhất" hoặc địa chỉ bất kỳ
      responses:
        "204":
          description: >
            Vị trí đã quy đổi & ghi nhận (lưu cả text lẫn lat/lng), phát
            event `driver.location_updated`.
        "400":
          description: Không quy đổi được vị trí (thiếu vi_tri_text)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        ho_ten: { type: string }
        sdt: { type: string }
        email: { type: string, format: email }

    Driver:
      type: object
      properties:
        id: { type: string }
        ho_ten: { type: string }
        trang_thai: { type: string, enum: [available, unavailable, on_trip] }
        diem_danh_gia: { type: number, format: float }

    Vehicle:
      type: object
      properties:
        id: { type: string }
        driver_id: { type: string }
        loai_xe: { type: string }
        bien_so: { type: string }

    TripSummary:
      type: object
      properties:
        id: { type: string }
        diem_don_text: { type: string }
        diem_den_text: { type: string }
        trang_thai: { type: string }
        tong_tien: { type: number, nullable: true }

x-events-published:
  - name: driver.location_updated
    x-fr: [FR30]
    x-ac: [AC35]
    description: Matching Service nghe để cập nhật dữ liệu lọc bán kính.
    payload: { driver_id: string, lat: number, lng: number }
