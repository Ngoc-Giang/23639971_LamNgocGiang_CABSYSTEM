openapi: 3.0.3
info:
  title: CAB - User/Auth Service
  description: >
    Quản lý tài khoản, xác thực, hồ sơ Customer & Driver.
    Sinh từ FR01-FR08, FR30 và AC tương ứng trong SRS (Bước 7 / Bước 13).
  version: "0.1.0-mvp"

servers:
  - url: https://api.cab.example.com/auth-service
    description: Mock/dev server

tags:
  - name: Auth
  - name: Customer
  - name: Driver

security:
  - bearerAuth: []

paths:
  /auth/register/customer:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản khách hàng
      x-fr: [FR01]
      x-ac: [AC01, AC02]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ho_ten, sdt, mat_khau]
              properties:
                ho_ten: { type: string }
                sdt: { type: string }
                email: { type: string, format: email }
                mat_khau: { type: string, format: password }
      responses:
        "201":
          description: Tạo tài khoản thành công (AC01)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "409":
          description: Định danh (SĐT/email) đã tồn tại (AC02)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/register/driver:
    post:
      tags: [Auth]
      summary: Tạo tài khoản tài xế (tự đăng ký hoặc do NV vận hành tạo)
      x-fr: [FR05]
      x-ac: [AC14]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ho_ten, sdt, mat_khau]
              properties:
                ho_ten: { type: string }
                sdt: { type: string }
                mat_khau: { type: string, format: password }
                tao_boi: { type: string, enum: [self, operations_staff], default: self }
      responses:
        "201":
          description: Tạo tài khoản tài xế thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "409":
          description: Định danh đã tồn tại
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập, cấp phiên (dùng chung Customer & Driver)
      x-fr: [FR02]
      x-ac: [AC01, AC03, AC14]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dinh_danh, mat_khau]
              properties:
                dinh_danh: { type: string, description: "SĐT hoặc email" }
                mat_khau: { type: string, format: password }
      responses:
        "200":
          description: Đăng nhập thành công, trả về token (AC01, AC14)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  role: { type: string, enum: [customer, driver] }
        "401":
          description: Sai mật khẩu (AC03) — khóa tạm thời sau N lần sai (default)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers/me:
    get:
      tags: [Customer]
      summary: Xem hồ sơ cá nhân
      x-fr: []
      x-ac: []
      responses:
        "200":
          description: Thông tin hồ sơ khách hàng
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
    put:
      tags: [Customer]
      summary: Cập nhật hồ sơ cá nhân (họ tên, SĐT, email)
      x-fr: [FR03]
      x-ac: []
      description: >
        LƯU Ý: UC02 hiện chưa có Acceptance Criteria (AC) tương ứng trong SRS —
        cần bổ sung trước khi viết test case cho endpoint này.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ho_ten: { type: string }
                sdt: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400":
          description: Trường bắt buộc thiếu hoặc không hợp lệ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers/me/trips:
    get:
      tags: [Customer]
      summary: Xem lịch sử chuyến đi + số tiền
      x-fr: [FR04]
      x-ac: [AC13]
      description: >
        Đọc dữ liệu tổng hợp từ Trip Service (qua API Gateway hoặc BFF).
        Đặt ở đây vì gắn với hồ sơ khách hàng, không sở hữu dữ liệu Trip gốc.
      responses:
        "200":
          description: Danh sách chuyến của chính khách hàng (AC13)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TripSummary" }

  /drivers/me:
    get:
      tags: [Driver]
      summary: Xem hồ sơ & phương tiện tài xế
      x-fr: []
      x-ac: [AC15]
      responses:
        "200":
          description: Thông tin hồ sơ + phương tiện
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
    put:
      tags: [Driver]
      summary: Cập nhật hồ sơ tài xế
      x-fr: [FR06]
      x-ac: [AC15]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ho_ten: { type: string }
      responses:
        "200":
          description: Cập nhật thành công (AC15)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }

  /drivers/me/vehicle:
    put:
      tags: [Driver]
      summary: Cập nhật thông tin phương tiện
      x-fr: [FR07]
      x-ac: [AC15]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Vehicle" }
      responses:
        "200":
          description: Lưu & dùng cho lọc ở Matching Service (AC15)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }

  /drivers/me/status:
    patch:
      tags: [Driver]
      summary: Đổi trạng thái sẵn sàng / không sẵn sàng
      x-fr: [FR08]
      x-ac: [AC16, AC17]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trang_thai]
              properties:
                trang_thai: { type: string, enum: [available, unavailable] }
      responses:
        "200":
          description: Cập nhật & đủ điều kiện được ghép (AC16, RULE01)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Driver" }
        "409":
          description: Ngoài ca làm việc hoặc đang có chuyến — từ chối (AC17, RULE02/RULE03)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /drivers/me/location:
    patch:
      tags: [Driver]
      summary: Ghi nhận & cập nhật vị trí tài xế (nạp dữ liệu cho Matching Service)
      x-fr: [FR30]
      x-ac: [AC35]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, format: float }
                lng: { type: number, format: float }
      responses:
        "204":
          description: Vị trí đã ghi nhận, phát event cho Matching Service dùng (AC35)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "FR50 — Xác thực trước chức năng cần tài khoản (RULE13, AC30)"

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    Customer:
      type: object
      properties:
        id: { type: string }
        ho_ten: { type: string }
        sdt: { type: string }
        email: { type: string, format: email }

    Driver:
      type: object
      properties:
        id: { type: string }
        ho_ten: { type: string }
        trang_thai: { type: string, enum: [available, unavailable, on_trip] }
        diem_danh_gia: { type: number, format: float }

    Vehicle:
      type: object
      properties:
        id: { type: string }
        driver_id: { type: string }
        loai_xe: { type: string }
        bien_so: { type: string }

    TripSummary:
      type: object
      description: Bản rút gọn của Trip (dữ liệu gốc thuộc Trip Service)
      properties:
        id: { type: string }
        diem_don: { type: string }
        diem_den: { type: string }
        trang_thai: { type: string }
        tong_tien: { type: number, nullable: true }
