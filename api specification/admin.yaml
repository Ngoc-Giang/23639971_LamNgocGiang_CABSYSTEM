openapi: 3.0.3
info:
  title: CAB - Admin/Ops Service
  description: >
    Giao diện quản trị & vận hành cho Operations Staff. Mọi
    endpoint dưới `/admin/*` đi qua middleware phân quyền. Chủ yếu xem
    danh sách và xử lý sự cố (resolve).
  version: "1.0.0"

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Admin

security:
  - bearerAuth: []
  - operationsRole: []

paths:
  /admin/customers:
    get:
      tags: [Admin]
      summary: Danh sách khách hàng (xem, tối giản)
      operationId: listCustomers
      x-fr: [FR45]
      x-ac: []
      responses:
        "200":
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomerRef" }
        "403":
          description: Không đủ quyền
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/drivers:
    get:
      tags: [Admin]
      summary: Danh sách tài xế (xem, tối giản)
      operationId: listDrivers
      x-fr: [FR45]
      x-ac: []
      responses:
        "200":
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverRef" }

  /admin/vehicles:
    get:
      tags: [Admin]
      summary: Danh sách phương tiện (xem, tối giản)
      operationId: listVehicles
      x-fr: [FR45]
      x-ac: []
      responses:
        "200":
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleRef" }

  /admin/trips:
    get:
      tags: [Admin]
      summary: Xem chuyến đang diễn ra + trạng thái tài xế
      operationId: listActiveTrips
      x-fr: [FR46]
      x-ac: [AC36]
      parameters:
        - name: status
          in: query
          schema: { type: string, example: active }
      responses:
        "200":
          description: Danh sách chuyến đang chạy
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TripRef" }

  /admin/trips/{tripId}/resolve:
    post:
      tags: [Admin]
      summary: Hỗ trợ xử lý chuyến bị lỗi (kẹt trạng thái, sai dữ liệu)
      operationId: resolveTrip
      x-fr: [FR47]
      x-ac: [AC50]
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trang_thai_moi]
              properties:
                trang_thai_moi:
                  type: string
                  description: Trạng thái đích nhân viên gán thủ công cho chuyến
                ghi_chu:
                  type: string
                  description: Lý do can thiệp — lưu kèm bản ghi audit
      responses:
        "200":
          description: >
            Chuyến lỗi đã được xử lý; thao tác được ghi log; khách/tài xế
            liên quan nhận thông báo cập nhật nếu có.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripRef" }

  /admin/transactions:
    get:
      tags: [Admin]
      summary: Tra cứu lịch sử giao dịch
      operationId: listTransactions
      x-fr: [FR48]
      x-ac: []
      responses:
        "200":
          description: Danh sách giao dịch thanh toán
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentRef" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Xem log thao tác quan trọng (audit)
      operationId: listAuditLogs
      x-fr: [FR51]
      x-ac: [AC37]
      responses:
        "200":
          description: Mỗi thao tác nhạy cảm sinh một bản ghi audit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditLog" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operationsRole:
      type: apiKey
      in: header
      name: X-Role
      description: Kiểm tra phân quyền cho thao tác nhạy cảm

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    CustomerRef:
      type: object
      description: Dữ liệu gốc thuộc Auth Service
      properties:
        id: { type: string }
        ho_ten: { type: string }
        sdt: { type: string }

    DriverRef:
      type: object
      description: Dữ liệu gốc thuộc Auth Service
      properties:
        id: { type: string }
        ho_ten: { type: string }
        trang_thai: { type: string }

    VehicleRef:
      type: object
      description: Dữ liệu gốc thuộc Auth Service
      properties:
        id: { type: string }
        driver_id: { type: string }
        loai_xe: { type: string }
        bien_so: { type: string }

    TripRef:
      type: object
      description: Dữ liệu gốc thuộc Trip Service
      properties:
        id: { type: string }
        trang_thai: { type: string }
        driver_id: { type: string, nullable: true }

    PaymentRef:
      type: object
      description: Dữ liệu gốc thuộc Payment Service
      properties:
        id: { type: string }
        trip_id: { type: string }
        trang_thai: { type: string }

    AuditLog:
      type: object
      properties:
        id: { type: string }
        loai_doi_tuong: { type: string }
        doi_tuong_id: { type: string }
        hanh_dong: { type: string }
        thoi_diem: { type: string, format: date-time }
