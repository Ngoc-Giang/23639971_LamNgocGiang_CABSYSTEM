openapi: 3.0.3
info:
  title: CAB - Notification Service
  description: >
    Không có REST endpoint công khai ngoài health check. Lắng nghe event
    từ Trip Service, Payment Service và Matching Service, rồi gửi thông
    báo (MVP: ghi log / in ra). File này tài liệu hoá "hợp đồng" event,
    không phải spec OpenAPI đầy đủ.
  version: "1.0.0"

servers:
  - url: http://localhost:8080/api/v1

paths:
  /health:
    get:
      summary: Health check (endpoint duy nhất công khai của service này)
      operationId: healthCheck
      responses:
        "200":
          description: Service đang chạy bình thường

x-events-consumed:
  - name: trip.created
    from: Trip Service
    x-fr: [FR37]
    x-ac: [AC33]
    description: Thông báo khách "đã tiếp nhận yêu cầu", ngay khi tạo chuyến.

  - name: trip.driver_assigned
    from: Trip Service
    x-fr: [FR38]
    x-ac: [AC18, AC33]
    description: Thông báo khách "có tài xế nhận".

  - name: trip.status_changed
    from: Trip Service
    x-fr: [FR39, FR40, FR43]
    x-ac: [AC33, AC34]
    description: >
      Thông báo khách khi tài xế đến điểm đón / hoàn thành chuyến.
      Thông báo tài xế khi có thay đổi ở chuyến đang chạy.

  - name: trip.matching_failed
    from: Trip Service
    x-fr: [FR20]
    x-ac: [AC26, AC33]
    description: Thông báo khách "không tìm được tài xế".

  - name: trip.cancelled
    from: Trip Service
    x-fr: [FR52, FR53, FR55]
    x-ac: [AC38, AC39, AC47]
    description: Thông báo bên còn lại (khách hoặc tài xế) khi có một bên hủy chuyến.

  - name: matching.offer_sent
    from: Matching Service
    x-fr: [FR42]
    x-ac: []
    description: Thông báo tài xế "chuyến mới".

  - name: payment.completed
    from: Payment Service
    x-fr: [FR41]
    x-ac: [AC33]
    description: Thông báo khách kết quả thanh toán.

  - name: payment.fallback_cash
    from: Payment Service
    x-fr: [FR41]
    x-ac: [AC10, AC33]
    description: Thông báo khách việc điện tử thất bại, đã chuyển tiền mặt.

x-mvp-note: >
  MVP chỉ ghi log/in ra tại đúng thời điểm, không tích hợp SMS/Push thật.
  Nghiệm thu bằng đúng thời điểm & nội dung thông báo.
