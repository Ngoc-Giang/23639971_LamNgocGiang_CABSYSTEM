openapi: 3.0.3
info:
  title: CAB - Payment / Fare Service
  description: >
    Tính cước & xử lý thanh toán. Khoảng cách chuyến (khoang_cach_km) lấy
    từ event `trip.completed` do Trip Service phát, dùng để áp công thức cước.
  version: "1.0.0"

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Fare
  - name: Payment

security:
  - bearerAuth: []

paths:
  /trips/{tripId}/fare:
    get:
      tags: [Fare]
      summary: Đọc kết quả tính cước (tự sinh khi nhận event trip.completed)
      operationId: getFare
      x-fr: [FR31]
      x-ac: [AC27, AC28]
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Cước = 12.000đ + 10.000đ × khoang_cach_km (default) theo loại dịch vụ.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Fare" }
        "409":
          description: Chuyến chưa hoàn thành — chưa có cước
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /trips/{tripId}/payment:
    post:
      tags: [Payment]
      summary: Chọn phương thức & thực hiện thanh toán (đồng bộ)
      operationId: makePayment
      x-fr: [FR32, FR33, FR34, FR35, FR36]
      x-ac: [AC09, AC10]
      description: >
        Nhánh điện tử thử lại tối đa 2 lần (default) trong cùng request;
        hết lần → tự chuyển tiền mặt.
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phuong_thuc]
              properties:
                phuong_thuc: { type: string, enum: [cash, e_wallet] }
                mock_ket_qua:
                  type: string
                  enum: [success, fail, random]
                  default: random
                  description: Ép kết quả mock provider cho demo/QA. Không có ý nghĩa với phuong_thuc=cash.
      responses:
        "200":
          description: >
            Tiền mặt — xác nhận đã thanh toán ngay. Điện tử — trả kết quả
            cuối cùng ngay trong response này: thành công (so_lan_thu ≤
            2), hoặc đã fallback sang tiền mặt sau 2 lần thất bại. Phát
            event payment.completed hoặc payment.fallback_cash tương ứng.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "409":
          description: Chuyến chưa có cước — chưa thể thanh toán
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema: { type: string }

  schemas:
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

    Fare:
      type: object
      properties:
        id: { type: string }
        trip_id: { type: string }
        khoang_cach_km: { type: number, format: float }
        tong_tien: { type: number }
        chi_tiet_tinh: { type: string }

    Payment:
      type: object
      properties:
        id: { type: string }
        trip_id: { type: string }
        phuong_thuc: { type: string, enum: [cash, e_wallet] }
        trang_thai: { type: string, enum: [pending, success, failed] }
        so_lan_thu: { type: integer }

x-events-consumed:
  - name: trip.completed
    from: Trip Service
    x-fr: [FR31]
    x-ac: [AC27]
    description: Kích hoạt tính cước theo khoang_cach_km và service_type_id.
    payload: { trip_id: string, khoang_cach_km: number, service_type_id: string }

x-events-published:
  - name: payment.completed
    x-fr: [FR41]
    x-ac: [AC33]
    description: Notification Service nghe để báo khách kết quả thanh toán.
    payload: { trip_id: string, payment_id: string }

  - name: payment.fallback_cash
    x-fr: [FR41]
    x-ac: [AC10, AC33]
    description: Notification Service nghe để báo khách đã chuyển tiền mặt.
    payload: { trip_id: string, payment_id: string }
